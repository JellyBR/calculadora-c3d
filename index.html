<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento C3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 p-4 md:p-8 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg overflow-hidden p-6 border-t-8 border-[#FF6600]">
        
        <!-- Cabeçalho com Logo -->
        <div class="text-center mb-6">
            <!-- O logotipo deve estar na mesma pasta no GitHub com o nome exato logo.png -->
            <img src="logo.png" alt="COISAS 3D Logo" class="mx-auto h-20 object-contain mb-2 fallback-logo" onerror="this.style.display='none'; document.getElementById('logo-texto').style.display='block';">
            <h2 id="logo-texto" class="text-3xl font-black text-black hidden">COISAS <span class="text-[#FF6600]">3D</span></h2>
            <p class="text-sm text-gray-500 font-medium uppercase tracking-wider mt-2">Calculadora Operacional</p>
        </div>
        
        <div class="space-y-5">
            <!-- Filamento -->
            <div>
                <label class="block text-sm font-bold text-black mb-1">Filamento Utilizado</label>
                <select id="filamento" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-50 shadow-sm p-3 border focus:ring-[#FF6600] focus:border-[#FF6600]">
                    <option value="0.1049">Voolt3d PLA Preto Velvet (R$ 0,10/g)</option>
                    <option value="0.0899">Voolt3d PLA Branco Silk / 3D Lab (R$ 0,09/g)</option>
                    <option value="0.0949">Voolt3d PLA Vermelho/Azul/Laranja (R$ 0,095/g)</option>
                    <option value="0.0998">Soleyin PLA Cinza/Branco (R$ 0,10/g)</option>
                    <option value="0.1249">Multifila PLA Dual (R$ 0,12/g)</option>
                    <option value="0.0935">3D Lab / Flashforge PETG (R$ 0,093/g)</option>
                </select>
            </div>

            <!-- Peso -->
            <div>
                <label class="block text-sm font-bold text-black mb-1">Peso da Peça (gramas)</label>
                <input type="number" id="peso" placeholder="Ex: 150" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-50 shadow-sm p-3 border focus:ring-[#FF6600] focus:border-[#FF6600]">
            </div>

            <!-- Tempo de Impressão -->
            <div class="flex gap-4">
                <div class="w-1/2">
                    <label class="block text-sm font-bold text-black mb-1">Tempo (Horas)</label>
                    <input type="number" id="horas" placeholder="Ex: 4" value="0" min="0" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-50 shadow-sm p-3 border focus:ring-[#FF6600] focus:border-[#FF6600]">
                </div>
                <div class="w-1/2">
                    <label class="block text-sm font-bold text-black mb-1">Minutos</label>
                    <input type="number" id="minutos" placeholder="Ex: 30" value="0" min="0" max="59" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-50 shadow-sm p-3 border focus:ring-[#FF6600] focus:border-[#FF6600]">
                </div>
            </div>

            <button onclick="calcularOrcamento()" class="w-full bg-[#FF6600] hover:bg-[#CC5200] text-white font-black text-lg py-4 px-4 rounded-md transition duration-200 mt-2 shadow-md uppercase tracking-wide">
                Gerar Preço de Venda
            </button>
        </div>

        <!-- Resultados -->
        <div id="resultado" class="hidden mt-8">
            <h3 class="text-lg font-bold text-black border-b-2 border-gray-200 pb-2 mb-3">Detalhamento de Custos</h3>
            <div class="flex justify-between text-sm mb-2">
                <span class="text-gray-600 font-medium">Custo Material:</span>
                <span id="custoMaterial" class="font-bold text-black">R$ 0,00</span>
            </div>
            <div class="flex justify-between text-sm mb-2">
                <span class="text-gray-600 font-medium">Custo Máquina (R$ 1,52/h):</span>
                <span id="custoMaquina" class="font-bold text-black">R$ 0,00</span>
            </div>
            <div class="flex justify-between text-sm mb-4">
                <span class="text-gray-600 font-medium">Custo Total de Produção:</span>
                <span id="custoProducao" class="font-bold text-black">R$ 0,00</span>
            </div>
            
            <div class="bg-black p-4 rounded-lg mt-4 text-center border-l-4 border-[#FF6600] shadow-md">
                <span class="block text-xs text-gray-300 font-bold mb-1 uppercase tracking-wide">Preço Final (Margem 20% + Taxas ML/Shopee)</span>
                <span id="precoFinal" class="block text-4xl font-black text-[#FF6600]">R$ 0,00</span>
            </div>
        </div>
    </div>

    <script>
        function calcularOrcamento() {
            // Entradas
            const custoGrama = parseFloat(document.getElementById('filamento').value);
            const peso = parseFloat(document.getElementById('peso').value) || 0;
            const horas = parseFloat(document.getElementById('horas').value) || 0;
            const minutos = parseFloat(document.getElementById('minutos').value) || 0;

            if (peso === 0 && horas === 0 && minutos === 0) return;

            // Parâmetros Fixos (Baseados na Planilha)
            const custoHoraMaquina = 1.523; 
            const markupLucro = 1.20; // 20% de lucro líquido alvo
            const taxaFixa = 1.00; // Taxa fixa marketplace
            const taxaVariavel = 0.05; // 5% comissão marketplace

            // Cálculos Base
            const custoMaterial = peso * custoGrama;
            const tempoTotalHoras = horas + (minutos / 60);
            const custoMaquina = tempoTotalHoras * custoHoraMaquina;
            const custoProducao = custoMaterial + custoMaquina;

            // Fórmula blindada para garantir a margem de 20% após os descontos
            const precoFinal = ((custoProducao * markupLucro) + taxaFixa) / (1 - taxaVariavel);

            // Atualização da Interface
            document.getElementById('custoMaterial').innerText = 'R$ ' + custoMaterial.toFixed(2).replace('.', ',');
            document.getElementById('custoMaquina').innerText = 'R$ ' + custoMaquina.toFixed(2).replace('.', ',');
            document.getElementById('custoProducao').innerText = 'R$ ' + custoProducao.toFixed(2).replace('.', ',');
            document.getElementById('precoFinal').innerText = 'R$ ' + precoFinal.toFixed(2).replace('.', ',');
            
            document.getElementById('resultado').classList.remove('hidden');
        }
    </script>
</body>
</html>
